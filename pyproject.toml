[project]
name = "bandwidth"
version = "1.0.0"
description = "A private Telegram agent that finds opportunities, checks whether you have time for them, and fills in the applications for you."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
apply = ["playwright>=1.48"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
bw = "bandwidth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bandwidth = ["apply/js/*.js", "planner/data/*.txt"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real services (run with -m live)"]
