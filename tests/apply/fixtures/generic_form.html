<!doctype html>
<html><head><meta charset="utf-8"><title>Software Intern - Acme | Lever</title>
<meta property="og:title" content="Acme - Software Intern"></head><body>
<!-- Markup patterns seen live 29 Oct 2026: Lever (labels in a sibling div, ✱ for required, native
     selects, radio and checkbox groups) and Ashby (yes/no buttons over a hidden checkbox, an
     "autofill from resume" upload above the form). -->
<div class="autofill"><p>Autofill from resume</p><p>Upload your resume here to autofill key application fields.</p>
  <input type="file" id="autofill"></div>
<form id="f" onsubmit="return false;">
  <div class="application-question"><div class="application-label">Resume/CV ✱</div>
    <div class="application-field"><input type="file" name="resume" id="resume"></div></div>
  <div class="application-question"><div class="application-label">Full name ✱</div>
    <div class="application-field"><input type="text" name="name"></div></div>
  <div class="application-question"><div class="application-label">Email ✱</div>
    <div class="application-field"><input type="email" name="email"></div></div>
  <div class="application-question"><div class="application-label">Current location ✱</div>
    <div class="application-field"><input type="text" name="location"></div></div>
  <div class="application-question"><div class="application-label">Which university are you attending? ✱</div>
    <div class="application-field"><select name="uni"><option value="">Select...</option><option>Aalto University</option>
      <option>Other</option></select></div></div>
  <div class="application-question"><div class="application-label">Are you legally authorized to work in the United States? ✱</div>
    <div class="application-field"><label><input type="radio" name="auth" value="y">Yes</label>
      <label><input type="radio" name="auth" value="n">No</label></div></div>
  <div class="application-question"><div class="application-label">Language Skill(s) ✱</div>
    <div class="application-field"><label><input type="checkbox" name="lang" value="en">English</label>
      <label><input type="checkbox" name="lang" value="fr">French</label></div></div>
  <div class="ashby-field"><label class="question-title">Do you have 7 years of experience?</label>
    <div class="yesno"><button type="button" data-option="yes" aria-pressed="false">Yes</button>
      <button type="button" data-option="no" aria-pressed="false">No</button><input type="checkbox" style="display:none" name="yrs"></div></div>
  <div class="application-question"><div class="application-label">Why Acme?</div>
    <div class="application-field"><textarea name="why"></textarea></div></div>
  <button type="submit">Submit application</button>
</form>
<script>
document.querySelectorAll('button[data-option]').forEach(b => b.onclick = () => {
  b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  b.setAttribute('aria-pressed', 'true');
});
</script>
</body></html>
